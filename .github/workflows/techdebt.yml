name: Tech Debt Gate
on: pull_request
permissions: { contents: read, pull-requests: read }
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: taursharad/techdebt-radar@main
        with:
          pr: ${{ github.event.pull_request.number }}
          fail-on: critical
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
